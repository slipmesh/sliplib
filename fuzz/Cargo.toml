[package]
name = "sliplib-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
sliplib-secrets = { path = "../secrets" }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[[bin]]
name = "decode_key"
path = "fuzz_targets/decode_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "private_key"
path = "fuzz_targets/private_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "same_key"
path = "fuzz_targets/same_key.rs"
test = false
doc = false
bench = false
