[workspace]
resolver = "3"
members = ["config", "fs", "kube", "mesh", "net", "runtime", "secrets", "slipmesh", "yaml"]

# One version and one tag for every crate: the shared release flow releases one version per
# repository.
[workspace.package]
version = "0.27.0"
edition = "2024"
authors = ["slipmesh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slipmesh/sliplib"
# Taken by git tag, never from crates.io.
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
futures = "0.3.34"
# An ordered map with serde: the mappings of format version 2, its groups among them, keep the
# order written.
indexmap = { version = "2.14.2", features = ["serde"] }
ipnet = "2.12.2"
# The binary picks the Kubernetes version and TLS: a library enables neither.
k8s-openapi = "0.29.0"
kube = { version = "5.2.0", default-features = false }
rand = "0.10.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The version x25519-dalek builds on, for its clamping alone.
curve25519-dalek = { version = "5.0.0", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tokio-graceful-shutdown = "0.20.0"
# The shutdown token tokio-graceful-shutdown hands out, at the version it builds on.
tokio-util = { version = "0.7.20", default-features = false }
tempfile = "3.27.0"
# The signals of the runtime's tests, at the version atomic-write-file builds on.
nix = { version = "0.32.0", default-features = false, features = ["signal"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
# The path of the key a value read whole was refused at, which a laid tree has no line for.
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sliplib-config = { path = "config" }
sliplib-fs = { path = "fs" }
sliplib-mesh = { path = "mesh" }
sliplib-net = { path = "net" }
sliplib-runtime = { path = "runtime" }
sliplib-secrets = { path = "secrets" }
sliplib-yaml = { path = "yaml" }
# `static_secrets` for a key that outlives one handshake, `getrandom` to generate one.
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
zeroize = { version = "1.9.2", features = ["derive"] }
yaml_serde = "0.10.7"
