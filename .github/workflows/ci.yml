# Pull requests and pushes run the checks. The push of a merged release PR also builds the
# `slipmesh` binaries, before the tag, so a failed build leaves no tag, and the release carries
# the binaries that build produced.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # cargo audit depends on the advisory database, not on the commit.
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: slipmesh/.github/.github/workflows/rust.yml@v4.0.2

  # The ignored tests need root to make a network namespace each.
  netns:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: test
        run: cargo test --locked --tests --all-features --config "target.'cfg(target_os = \"linux\")'.runner = 'sudo'" -- --ignored

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v4.0.2

  build:
    needs: [release-commit, checks, netns]
    if: needs.release-commit.outputs.version != ''
    uses: slipmesh/.github/.github/workflows/rust-build.yml@v4.0.2
    with:
      binaries: slipmesh
      build-args: -p slipmesh

  tag:
    needs: [release-commit, build]
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v4.0.2
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  release:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/release.yml@v4.0.2
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ needs.release-commit.outputs.latest == 'true' }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
      download-binaries: true
      prepare: |
        mkdir dist
        for arch in amd64 arm64; do
          cp "binaries/$arch/release/slipmesh" "dist/slipmesh-linux-$arch"
        done
        (cd dist && sha256sum -- * > SHA256SUMS)
      assets: dist/slipmesh-linux-amd64 dist/slipmesh-linux-arm64 dist/SHA256SUMS
