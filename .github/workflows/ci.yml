# Pull requests and pushes run the checks; a merged release PR is tagged and released in the same
# run. The crates are consumed by git tag, so a release builds nothing: the tag and its notes are
# the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # cargo audit depends on the advisory database, not on the commit.
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: slipmesh/.github/.github/workflows/rust.yml@v3.1.0

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v3.1.0

  tag:
    needs: [release-commit, checks]
    if: needs.release-commit.outputs.version != ''
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v3.1.0
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  release:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/release.yml@v3.1.0
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ needs.release-commit.outputs.latest == 'true' }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
