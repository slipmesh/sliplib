# Pull requests and pushes run the checks; a merged release PR is tagged and released in the same
# run. The crates are consumed by git tag, so a release builds nothing: the tag and its notes are
# the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # cargo audit depends on the advisory database, not on the commit.
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: slipmesh/.github/.github/workflows/rust.yml@v2.4

  # The fuzz targets are outside the workspace, so the shared checks never see them; this keeps
  # them building. Fuzzing itself runs before a pull request, not here.
  fuzz-targets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v2.4

  tag:
    needs: [release-commit, checks, fuzz-targets]
    if: needs.release-commit.outputs.version != ''
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v2.4
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  release:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/release.yml@v2.4
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ needs.release-commit.outputs.latest == 'true' }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
