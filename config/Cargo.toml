[package]
name = "sliplib-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "slipmesh.yaml, and the configs the slipmesh tools write from it for the daemons to read"

[features]
# The `Mesh` custom resource and its CRD, for the agents; the tool that writes it builds without.
kube = ["dep:k8s-openapi", "dep:kube", "dep:schemars", "dep:serde_json"]

[dependencies]
indexmap.workspace = true
# The derive's code names these two; the binary picks the Kubernetes version.
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true, features = ["derive"] }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sliplib-net.workspace = true
sliplib-secrets.workspace = true
sliplib-yaml.workspace = true
thiserror.workspace = true

[dev-dependencies]
k8s-openapi = { workspace = true, features = ["v1_37"] }
kube = { workspace = true, features = ["cel", "derive"] }
serde_json.workspace = true
tempfile.workspace = true
