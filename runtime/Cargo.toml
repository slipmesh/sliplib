[package]
name = "sliplib-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Logging and shutdown set up the same way for every slipmesh daemon and tool, and a daemon's Prometheus endpoint"

[features]
default = ["serve"]
# A tool that only logs, such as a CLI, leaves this out and with it the shutdown dependencies.
serve = ["dep:anyhow", "dep:tokio-graceful-shutdown", "dep:tokio-util"]
# A daemon's Prometheus endpoint.
metrics = [
    "dep:anyhow",
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:prometheus-client",
    "dep:socket2",
    "dep:tokio",
    "dep:tracing",
]

[dependencies]
anyhow = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
prometheus-client = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "rt", "time"] }
tracing = { workspace = true, optional = true }
tokio-graceful-shutdown = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
anyhow.workspace = true
prometheus-client.workspace = true
nix.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "serve"
required-features = ["serve"]

[[test]]
name = "sigterm"
required-features = ["serve"]

[[test]]
name = "shutdown_timeout"
required-features = ["serve"]

[[test]]
name = "metrics"
required-features = ["metrics"]
