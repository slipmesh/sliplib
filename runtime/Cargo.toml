[package]
name = "sliplib-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Logging and shutdown set up the same way for every slipmesh daemon and tool"

[features]
default = ["serve"]
# A tool that only logs, such as a CLI, leaves this out and with it the shutdown dependencies.
serve = ["dep:anyhow", "dep:tokio-graceful-shutdown", "dep:tokio-util"]

[dependencies]
anyhow = { workspace = true, optional = true }
tokio-graceful-shutdown = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "serve"
required-features = ["serve"]

[[test]]
name = "sigterm"
required-features = ["serve"]

[[test]]
name = "shutdown_timeout"
required-features = ["serve"]
