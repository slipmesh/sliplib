# The secrets of the example network, laid over mesh.yaml: the same tree, holding only what
# `slipmesh mint` wrote and the header protection key, written by hand. Every key is one letter
# repeated.

slipmesh:
  kind: network
  version: 2
  revision: 1
mesh:
  links:
    a-b:
      amneziawg:
        obfuscation:
          jc: 4
          jmin: 40
          jmax: 400
          s1: 64
          s2: 48
          h1: 1101
          h2: 2202
          h3: 3303
          h4: 4404
          # Written by hand. Both ends get it, and s1 to s4 are 12 or more here.
          header_protection_key: YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY=
    a-c:
      amneziawg:
        obfuscation:
          jc: 5
          jmin: 50
          jmax: 500
          s1: 72
          s2: 56
          h1: 8808
          h2: 6606
          h3: 7707
nodes:
  node-a:
    wireguard:
      private_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  node-b:
    wireguard:
      private_key: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE=
  node-c:
    wireguard:
      private_key: IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII=
  router1:
    wireguard:
      private_key: MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM=
