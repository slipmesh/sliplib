[package]
name = "sliplib-mesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A node's awg and router configs, computed from slipmesh.yaml"

[features]
# Creating the secrets slipmesh.yaml lacks. Off for a tool that only reads the file, which then has
# no function that creates one.
mint = ["dep:rand"]

[dependencies]
anyhow.workspace = true
rand = { workspace = true, optional = true }
sliplib-config.workspace = true
sliplib-net.workspace = true
sliplib-secrets.workspace = true

[dev-dependencies]
sliplib-yaml.workspace = true
