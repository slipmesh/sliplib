[package]
name = "sliplib-mesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A node's awg and router configs, computed from slipmesh.yaml"

[features]
# Creating the secrets a topology lacks. Off for a tool that only reads slipmesh.yaml: the function
# that creates them is then not in its build.
mint = ["dep:rand"]

[dependencies]
rand = { workspace = true, optional = true }
sliplib-config.workspace = true
sliplib-secrets.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
sliplib-yaml.workspace = true
