# A network of format version 1 converted to version 2 by hand, as docs/slipmesh-yaml-v1-to-v2.md
# says. ../v1-alternate holds the configs version 1 gave its nodes, and the test beside it shows
# that every node gets them, but for what that document lists. The pool and the bypass list of the
# file of version 1 have no place here.
#
# Every network and address is from a range reserved for documentation; a node_id is an identity,
# not an address. Every name stands for nothing and every key is one letter repeated.

slipmesh:
  kind: network
  version: 2
  revision: 1
addressing:
  loopback:
    ipv4: 198.51.100.0/25
    ipv6: "3fff:0:0:1::/64"
routing:
  bgp:
    as: 64501
  direct_interfaces: [lan0]
  classes:
    egress:
      protocol: 153
mesh:
  interface_prefix: wg-
  mtu: 1400
  links:
    east-west:
      type: amneziawg
      ends: {east: {}, west: {}}
      amneziawg:
        port: 51830
        obfuscation: {jc: 4, jmin: 40, jmax: 400, s1: 64, s2: 48, h1: 1101, h2: 2202, h3: 3303, h4: 4404}
    # The file of version 1 marked it `plain` and gave it an obfuscation, which reached nothing.
    west-south:
      type: wireguard
      ends: {west: {}, south: {}}
      wireguard:
        port: 51831
nodes:
  east:
    platform: talos
    node_id: 0.0.0.5
    underlay:
      wan:
        endpoint: {ipv6: "2001:db8::1"}
    wireguard:
      private_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  west:
    platform: talos
    node_id: 0.0.0.2
    underlay:
      wan: {}
    wireguard:
      private_key: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE=
  south:
    platform: talos
    node_id: 0.0.0.3
    underlay:
      wan:
        endpoint: {ipv4: 192.0.2.3}
    wireguard:
      private_key: IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII=
